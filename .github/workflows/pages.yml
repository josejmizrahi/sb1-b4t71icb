name: Publish report to GitHub Pages
# Pages enabled (Source: GitHub Actions) — redeploy.

on:
  push:
    branches: [main, claude/world-cup-2026-predictor-y9t68f]
    paths:
      - "worldcup2026/**"
      - ".github/workflows/pages.yml"
  schedule:
    # Refresh predictions daily (runs on the default branch only).
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worldcup2026
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate report
        env:
          # If you add BALLDONTLIE_API_KEY as a repo secret, the page uses real
          # xG (full engine); otherwise it falls back to the free openfootball
          # provider (reduced, FIFA-only). No secret required for it to work.
          BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
          # Skip the slow per-player fetch in CI (trial rate limit makes it
          # exceed the build window); first-goal scorers come from the committed
          # snapshot (data/player_threats.json) instead.
          BALLDONTLIE_FETCH_PLAYER_GOALS: "false"
        run: |
          set -e
          export ENGINE=auto SQLITE_PATH=pages.db
          OUT="$GITHUB_WORKSPACE/site/index.html"
          ok=0
          if [ -n "$BALLDONTLIE_API_KEY" ]; then
            echo "Trying DATA_PROVIDER=balldontlie (real xG)..."
            if DATA_PROVIDER=balldontlie timeout 300 python -m wc2026.cli predict \
                 --engine auto --sims 15000 --out "$OUT"; then
              ok=1
            else
              echo "::warning::balldontlie failed (key invalid / rate limit); falling back to openfootball"
              rm -f pages.db
            fi
          fi
          if [ "$ok" != "1" ]; then
            echo "Building with DATA_PROVIDER=openfootball (free, reliable)..."
            DATA_PROVIDER=openfootball python -m wc2026.cli predict \
              --engine auto --sims 15000 --out "$OUT"
          fi
          test -s "$OUT"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    # The github-pages environment only allows deploys from the default branch,
    # so we deploy from main. On feature branches the build still runs/validates
    # but deploy is skipped (keeps the PR check green). Merge to publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# trigger rebuild: pick up updated BALLDONTLIE_API_KEY secret
